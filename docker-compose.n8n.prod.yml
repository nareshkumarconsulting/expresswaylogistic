# Production n8n — run on VPS (24/7 email pipeline)
# Usage on server:
#   cp .env.n8n.production.example .env.n8n   # fill values
#   docker compose -f docker-compose.n8n.prod.yml up -d
#
# All secrets/config come from .env.n8n via env_file (do not re-declare
# ${VAR} here — Compose would overwrite them with blank strings).

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    env_file:
      - .env.n8n
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  n8n_data:
